[package]
name = "purgecraft"
version = "1.0.4"
edition = "2021"

[dependencies]
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = "0.30"
winreg = "0.52"
open = "5.3"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
rfd = "0.15"

[[bin]]
name = "purgecraft"
path = "src/main.rs"

[[bin]]
name = "setup_test"
path = "src/setup_test.rs"

[build-dependencies]
winres = "0.1"

