name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release --bin purgecraft --manifest-path desktop_rust/Cargo.toml

      - name: Package Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item desktop_rust/target/release/purgecraft.exe dist/PurgeCraft.exe
          Compress-Archive -Path dist/PurgeCraft.exe -DestinationPath dist/PurgeCraft-Windows-x64.zip
          $hash = (Get-FileHash dist/PurgeCraft-Windows-x64.zip -Algorithm SHA256).Hash
          "$hash  PurgeCraft-Windows-x64.zip" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/PurgeCraft.exe
            dist/PurgeCraft-Windows-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
