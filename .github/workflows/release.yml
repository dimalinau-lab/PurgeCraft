name: Release PurgeCraft

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Executable
        run: cargo build --manifest-path desktop_rust/Cargo.toml --release

      - name: Package Assets & Calculate Checksums
        shell: pwsh
        run: |
          Copy-Item "desktop_rust/target/release/PurgeCraft.exe" "PurgeCraft.exe"
          $hash = (Get-FileHash -Algorithm SHA256 "PurgeCraft.exe").Hash.ToLower()
          "$hash  PurgeCraft.exe" | Out-File -Encoding utf8 SHA256SUMS.txt
          Write-Host "SHA256: $hash"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PurgeCraft.exe
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
